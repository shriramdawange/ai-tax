services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_tax
      POSTGRES_USER: ai_tax
      POSTGRES_PASSWORD: ai_tax_dev
    ports:
      - "5432:5432"
    volumes:
      - ai_tax_pg:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
      - ./db/003-part2.sql:/docker-entrypoint-initdb.d/003-part2.sql:ro
      - ./db/004-part3.sql:/docker-entrypoint-initdb.d/004-part3.sql:ro
  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run build && npm start"
    environment:
      DATABASE_URL: postgres://ai_tax:ai_tax_dev@db:5432/ai_tax
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    depends_on:
      - db
volumes:
  ai_tax_pg:
