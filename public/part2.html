<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI TAX — Automation</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#17202a}.wrap{max-width:1100px;margin:40px auto;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;border:1px solid #e1e6ef;border-radius:14px;padding:20px}textarea,input,select,button{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d4dbe5;border-radius:8px;margin:6px 0}button{background:#111827;color:white;cursor:pointer}.out{white-space:pre-wrap;background:#f0f3f7;padding:12px;border-radius:8px;max-height:360px;overflow:auto}.muted{color:#687386}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>AI TAX — Part 2 Automation</h1><p class="muted">Documents → extraction · Bank statement → import → reconciliation</p><div class="grid"><section class="card"><h2>Invoice / document extraction</h2><label>File name<input id="df" value="invoice.txt"></label><label>MIME type<input id="dm" value="text/plain"></label><label>Machine-readable document text<textarea id="dt" rows="15" placeholder="TAX INVOICE\nInvoice No: INV-42\nInvoice Date: 01/08/2026\nGSTIN: 27ABCDE1234F1Z5\nTaxable Value: 100000\nCGST: 9000\nSGST: 9000\nGrand Total: 118000"></textarea></label><button onclick="extract()">Extract & store</button><div id="do" class="out"></div></section><section class="card"><h2>Bank CSV import</h2><label>Bank account ID<input id="bi" value="00000000-0000-0000-0000-000000000201"></label><label>File name<input id="bf" value="bank.csv"></label><label>CSV<textarea id="bt" rows="15">Date,Description,Debit,Credit,Balance
01/08/2026,Office payment,1000,,9000
02/08/2026,Customer payment,,5000,14000</textarea></label><button onclick="imp()">Import bank CSV</button><button onclick="rec()">Run reconciliation</button><div id="bo" class="out"></div></section></div></div><script>const out=(id,x)=>document.getElementById(id).textContent=JSON.stringify(x,null,2);async function call(u,o){const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x}async function extract(){try{out('do',await call('/api/part2/documents/extract',{method:'POST',body:JSON.stringify({fileName:df.value,mimeType:dm.value,text:dt.value})}))}catch(e){out('do',{error:e.message})}}async function imp(){try{out('bo',await call('/api/part2/banks/'+bi.value+'/import-csv',{method:'POST',body:JSON.stringify({fileName:bf.value,csv:bt.value})}))}catch(e){out('bo',{error:e.message})}}async function rec(){try{out('bo',await call('/api/part2/banks/'+bi.value+'/reconcile',{method:'POST'}))}catch(e){out('bo',{error:e.message})}}</script></body></html>
