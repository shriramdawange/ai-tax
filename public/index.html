<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI TAX — Financial Control Center</title><style>:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#17202a;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.shell{display:flex;min-height:100vh}.side{width:245px;background:#0e1726;color:#fff;padding:24px;position:sticky;top:0;height:100vh}.brand{font-size:24px;font-weight:850;margin-bottom:8px}.tag{font-size:12px;color:#8fa0b8;margin-bottom:28px}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#aebbd0;text-align:left;width:100%;border:0;padding:11px 12px;border-radius:9px}.nav button.active,.nav button:hover{background:#24334a;color:#fff}.main{flex:1;padding:30px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.top h1{margin:0 0 4px}.muted{color:#6b7788}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:14px;padding:18px;box-shadow:0 4px 18px #172b4d08}.metric{font-size:27px;font-weight:800;margin-top:7px}.section{margin-top:18px}.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}.row{display:flex;justify-content:space-between;gap:20px;padding:11px 0;border-bottom:1px solid #edf0f4}.row:last-child{border-bottom:0}.status{display:inline-flex;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800;background:#eaf7ee;color:#17733b}.status.warn{background:#fff4df;color:#8a5a00}button,.primary{border:0;border-radius:9px;padding:10px 14px;background:#111827;color:#fff;cursor:pointer;font-weight:650}.secondary{background:#edf1f6;color:#182333}.danger{background:#b42318}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}input,select{border:1px solid #d8dee7;border-radius:8px;padding:10px;background:#fff;width:100%}label{display:grid;gap:6px;font-size:12px;font-weight:700;color:#526071}form{display:grid;gap:12px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf0f4;white-space:nowrap}th{color:#667387;font-size:11px;text-transform:uppercase}.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px}.hidden{display:none}.notice{padding:12px;border-radius:10px;background:#eef5ff;color:#24548c}.error{color:#b42318;font-size:13px}.empty{padding:25px;text-align:center;color:#7a8696}.bar{height:9px;background:#e9edf3;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;width:100%;background:#16a34a}@media(max-width:1000px){.side{width:190px}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:650px){.side{display:none}.main{padding:16px}.grid,.formgrid{grid-template-columns:1fr}}</style></head><body><div class="shell"><aside class="side"><div class="brand">AI TAX</div><div class="tag">Financial control center</div><div class="nav"><button class="active" data-page="dashboard">Dashboard</button><button data-page="journals">Journal & Ledger</button><button data-page="invoices">Invoices</button><button data-page="reports">Financial Reports</button><button data-page="compliance">GST / TDS</button></div></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div class="muted" id="org">Loading...</div></div><button class="secondary" onclick="loadAll()">Sync & Recheck</button></div><div id="app"></div></main></div><script>
const $=s=>document.querySelector(s),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
let cache={};
async function api(url,opt){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}
function nav(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#title').textContent=page==='dashboard'?'Dashboard':page==='journals'?'Journal & Ledger':page==='invoices'?'Invoices':page==='reports'?'Financial Reports':'Compliance';render(page)}
async function loadAll(){try{cache.dashboard=await api('/api/dashboard');cache.invoices=await api('/api/invoices');cache.journals=await api('/api/journals');cache.accounts=await api('/api/accounts');cache.parties=await api('/api/parties');cache.compliance=await api('/api/compliance/summary');$('#org').textContent=cache.dashboard.organization?.name||'Business';render(document.querySelector('.nav button.active').dataset.page)}catch(e){$('#org').textContent=e.message}}
function render(page){if(page==='dashboard')dashboard();if(page==='journals')journals();if(page==='invoices')invoices();if(page==='reports')reports();if(page==='compliance')compliance()}
function dashboard(){const d=cache.dashboard,s=d.summary||{};$('#app').innerHTML=`<div class="grid"><div class="card"><div class="muted">Revenue</div><div class="metric">${money(s.revenue)}</div></div><div class="card"><div class="muted">Expenses</div><div class="metric">${money(s.expenses)}</div></div><div class="card"><div class="muted">Net profit</div><div class="metric">${money(s.profit)}</div></div><div class="card"><div class="muted">Open exceptions</div><div class="metric">${d.exceptions.length}</div></div></div><div class="two section"><div class="card"><h3>Accounting integrity</h3><div class="row"><span>Total debits</span><b>${money(d.totals.debit)}</b></div><div class="row"><span>Total credits</span><b>${money(d.totals.credit)}</b></div><div class="bar"><span></span></div><p class="muted">All posted journals are required to balance exactly.</p></div><div class="card"><h3>Compliance</h3><div class="row"><span>GST net</span><b>${money(cache.compliance.gst.netTax)}</b></div><div class="row"><span>TDS liability</span><b>${money(cache.compliance.tds.liability)}</b></div><div class="row"><span>Status</span><span class="status ${cache.compliance.openExceptions?'warn':''}">${cache.compliance.openExceptions?'ACTION REQUIRED':'READY FOR PREPARATION'}</span></div></div></div><div class="section card"><h3>Trial balance</h3>${tb(cache.dashboard.trialBalance)}</div><div class="section card"><h3>AI exceptions</h3>${d.exceptions.length?d.exceptions.map(x=>`<div class="row"><span><b>${x.severity}</b> ${x.title}<br><small class="muted">${x.description}</small></span><span>${x.status}</span></div>`).join(''):'<div class="empty">No open exceptions.</div>'}</div>`}
function tb(rows){return `<div class="tablewrap"><table><thead><tr><th>Code</th><th>Account</th><th>Type</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.code}</td><td>${x.name}</td><td>${x.type}</td><td>${money(x.debit)}</td><td>${money(x.credit)}</td></tr>`).join('')}</tbody></table></div>`}
function journals(){const a=cache.accounts||[];$('#app').innerHTML=`<div class="two"><div class="card"><h3>Post journal</h3><div class="notice">Phase 1 uses deterministic double-entry posting. AI proposals will plug into this engine in a later part.</div><form onsubmit="postJournal(event)"><div class="formgrid"><label>Voucher number<input id="vno" required placeholder="JV-0001"></label><label>Type<select id="vtype"><option>JOURNAL</option><option>SALES</option><option>PURCHASE</option><option>RECEIPT</option><option>PAYMENT</option><option>CONTRA</option><option>ADJUSTMENT</option></select></label><label>Date<input id="vdate" type="date" value="2026-08-18" required></label><label>Narration<input id="vnarr" required placeholder="Office expense paid from bank"></label></div><div class="formgrid"><label>Debit account<select id="debitAccount">${a.map(x=>`<option value="${x.id}">${x.code} — ${x.name}</option>`).join('')}</select></label><label>Debit amount<input id="debitAmount" type="number" min="0.01" step="0.01" required></label><label>Credit account<select id="creditAccount">${a.map(x=>`<option value="${x.id}">${x.code} — ${x.name}</option>`).join('')}</select></label><label>Credit amount<input id="creditAmount" type="number" min="0.01" step="0.01" required></label></div><div id="jerr" class="error"></div><button type="submit">Post balanced journal</button></form></div><div class="card"><h3>Recent journals</h3>${cache.journals?.length?cache.journals.map(j=>`<div class="row"><span><b>${j.voucher_number}</b><br><small>${j.entry_date} · ${j.narration}</small></span><b>${money(j.debit)}</b></div>`).join(''):'<div class="empty">No journals yet.</div>'}</div></div>`}
async function postJournal(e){e.preventDefault();$('#jerr').textContent='';const d=Number($('#debitAmount').value),c=Number($('#creditAmount').value);if(Math.round(d*100)!==Math.round(c*100)){$('#jerr').textContent='Debit and credit must match exactly.';return}try{await api('/api/journals',{method:'POST',body:JSON.stringify({voucherNumber:$('#vno').value,voucherType:$('#vtype').value,entryDate:$('#vdate').value,narration:$('#vnarr').value,lines:[{accountId:$('#debitAccount').value,debit:d,credit:0},{accountId:$('#creditAccount').value,debit:0,credit:c}]})});await loadAll();nav('journals')}catch(e){$('#jerr').textContent=e.message}}
function invoices(){const ps=cache.parties||[];$('#app').innerHTML=`<div class="two"><div class="card"><h3>Create validated invoice</h3><div class="notice">This creates a source invoice record. Automatic posting to accounting will be added after the document/transaction engine.</div><form onsubmit="createInvoice(event)"><div class="formgrid"><label>Invoice number<input id="ino" required placeholder="INV-1001"></label><label>Date<input id="idate" type="date" value="2026-08-18" required></label><label>Type<select id="itype"><option>SALES</option><option>PURCHASE</option><option>CREDIT_NOTE</option><option>DEBIT_NOTE</option></select></label><label>Party<select id="iparty"><option value="">No party</option>${ps.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></label><label>Description<input id="idesc" value="Professional services" required></label><label>Taxable value<input id="itax" type="number" min="0" step="0.01" required></label><label>GST rate<input id="igrate" type="number" min="0" step="0.01" value="18"></label><label>GST split<select id="isplit"><option value="local">CGST + SGST</option><option value="igst">IGST</option></select></label></div><div id="ierr" class="error"></div><button type="submit">Create invoice</button></form></div><div class="card"><h3>Invoices</h3>${cache.invoices?.length?`<div class="tablewrap"><table><thead><tr><th>Number</th><th>Date</th><th>Type</th><th>Party</th><th>Total</th><th>Status</th></tr></thead><tbody>${cache.invoices.map(i=>`<tr><td>${i.invoice_number}</td><td>${i.invoice_date}</td><td>${i.document_type}</td><td>${i.party_name||'—'}</td><td>${money(i.total)}</td><td>${i.status}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No invoices yet.</div>'}</div></div>`}
async function createInvoice(e){e.preventDefault();$('#ierr').textContent='';const t=Number($('#itax').value),rate=Number($('#igrate').value),tax=t*rate/100;const local=$('#isplit').value==='local';try{await api('/api/invoices',{method:'POST',body:JSON.stringify({invoiceNumber:$('#ino').value,invoiceDate:$('#idate').value,documentType:$('#itype').value,partyId:$('#iparty').value||undefined,items:[{description:$('#idesc').value,quantity:1,unitPrice:t,gstRate:rate,cgst:local?tax/2:0,sgst:local?tax/2:0,igst:local?0:tax,cess:0}]})});await loadAll();nav('invoices')}catch(e){$('#ierr').textContent=e.message}}
function reports(){const s=cache.dashboard.summary;$('#app').innerHTML=`<div class="grid"><div class="card"><div class="muted">Revenue</div><div class="metric">${money(s.revenue)}</div></div><div class="card"><div class="muted">Expenses</div><div class="metric">${money(s.expenses)}</div></div><div class="card"><div class="muted">Profit</div><div class="metric">${money(s.profit)}</div></div><div class="card"><div class="muted">Net assets</div><div class="metric">${money(s.assets)}</div></div></div><div class="two section"><div class="card"><h3>Profit & Loss</h3><div class="row"><span>Revenue</span><b>${money(s.revenue)}</b></div><div class="row"><span>Expenses</span><b>${money(s.expenses)}</b></div><div class="row"><span>Net profit</span><b>${money(s.profit)}</b></div></div><div class="card"><h3>Balance Sheet</h3><div class="row"><span>Assets</span><b>${money(s.assets)}</b></div><div class="row"><span>Liabilities</span><b>${money(s.liabilities)}</b></div><div class="row"><span>Equity</span><b>${money(s.equity)}</b></div></div></div><div class="section card"><h3>Trial Balance</h3>${tb(cache.dashboard.trialBalance)}</div>`}
function compliance(){const c=cache.compliance;$('#app').innerHTML=`<div class="grid"><div class="card"><div class="muted">GST output</div><div class="metric">${money(c.gst.outputTax)}</div></div><div class="card"><div class="muted">GST input</div><div class="metric">${money(c.gst.inputTax)}</div></div><div class="card"><div class="muted">GST net</div><div class="metric">${money(c.gst.netTax)}</div></div><div class="card"><div class="muted">TDS liability</div><div class="metric">${money(c.tds.liability)}</div></div></div><div class="section card"><h3>Compliance gate</h3><div class="row"><span>Accounting source</span><span class="status">READY</span></div><div class="row"><span>GST preparation</span><span class="status">PREPARATION</span></div><div class="row"><span>Official filing</span><span class="status warn">NOT CONNECTED</span></div><p class="muted">Government submission is deliberately isolated behind official integration and authorization gates. No filing success is fabricated.</p></div>`}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));loadAll();
</script></body></html>
