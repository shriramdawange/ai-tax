<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI TAX — Part 5</title><style>body{font-family:system-ui;max-width:1100px;margin:40px auto;padding:0 20px;background:#0b1020;color:#eef2ff}section{background:#151c31;border:1px solid #2b3658;border-radius:16px;padding:20px;margin:16px 0}input,select,textarea,button{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #39476e;background:#0f1527;color:#fff}button{cursor:pointer}pre{white-space:pre-wrap;overflow:auto;background:#0b1020;padding:14px;border-radius:10px}.ok{color:#7ee787}.warn{color:#ffcc66}</style></head><body><h1>AI TAX — Part 5</h1><p>Production compliance and government-integration gateway.</p><section><h2>Integration status</h2><button onclick="health()">Check integration</button><pre id="health">Not checked</pre></section><section><h2>Create filing package</h2><select id="kind"><option>GSTR1</option><option>GSTR3B</option><option>TDS</option><option>ITR</option></select><input id="period" value="2026-27" placeholder="Period / Assessment Year"><textarea id="payload" rows="10">{"example":true,"source":"AI TAX"}</textarea><button onclick="create()">Validate & create filing</button><pre id="result"></pre></section><section><h2>Filing records</h2><button onclick="list()">Refresh</button><pre id="list"></pre></section><script>const j=(x)=>JSON.stringify(x,null,2);async function health(){healthEl=document.getElementById('health');healthEl.textContent=j(await (await fetch('/api/part5/compliance/health')).json())}async function create(){let payload;try{payload=JSON.parse(document.getElementById('payload').value)}catch(e){return document.getElementById('result').textContent='Invalid JSON'}const r=await fetch('/api/part5/compliance/filings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({kind:document.getElementById('kind').value,period:document.getElementById('period').value,payload})});document.getElementById('result').textContent=j(await r.json());list()}async function list(){document.getElementById('list').textContent=j(await (await fetch('/api/part5/compliance/filings')).json())}health();list();</script></body></html>
